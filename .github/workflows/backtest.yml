name: Gold ETF backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/option_snapshots_gated.csv'
  schedule:
    - cron: '35 12 * * 6,0-3'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run research safeguards
        run: pytest -q
      - name: Download and validate TSETMC history
        timeout-minutes: 3
        run: python src/download_tsetmc.py
      - name: Run V0-V5 research pipeline
        run: python src/backtest.py
      - name: Calibrate empirical V3 scenarios
        run: python src/scenario_calibration.py
      - name: Build strict V3 option coverage matrix
        run: |
          if [ -f data/option_snapshots_gated.csv ]; then
            python src/option_coverage_matrix.py --snapshots data/option_snapshots_gated.csv
          else
            python src/option_coverage_matrix.py
          fi
      - name: Run walk-forward instrument competition
        run: |
          if [ -f data/option_snapshots_gated.csv ]; then
            python src/walkforward_instrument_competition.py --quotes data/option_snapshots_gated.csv
          else
            python src/walkforward_instrument_competition.py
          fi
      - name: Run cash, slippage and Monte Carlo tests
        run: python src/robustness.py
      - name: Download independent ETF validation data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/download_validation.py
      - name: Run frozen V2/V3 multi-ETF validation
        run: python src/multi_asset_validation.py
      - name: Produce paper forward signal
        run: python src/forward_signal.py
      - name: Apply fail-closed paper promotion gate
        run: python src/promotion_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: gold-etf-backtest-results
          path: |
            data/tala_history.csv
            data/validation/
            results/
          retention-days: 90
