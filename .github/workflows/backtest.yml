name: Gold ETF backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '35 12 * * 6,0-3'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download and validate TSETMC history
        timeout-minutes: 3
        run: python src/download_tsetmc.py
      - name: Run V0-V5 research pipeline
        run: python src/backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: gold-etf-backtest-results
          path: |
            data/tala_history.csv
            results/
          retention-days: 30
