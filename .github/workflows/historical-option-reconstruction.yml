name: Historical option reconstruction
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/historical_option_reconstruction.py'
      - 'src/historical_option_audit.py'
      - '.github/workflows/historical-option-reconstruction.yml'

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download underlying history
        run: python src/download_tsetmc.py
      - name: Build V3 trades
        run: python src/backtest.py
      - name: Reconstruct historical option Bid/Ask
        run: python src/historical_option_reconstruction.py
      - name: Audit reconstructed option books
        run: python src/historical_option_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: historical-option-reconstruction
          path: |
            results/historical_option_bidask.csv
            results/historical_option_contract_manifest.csv
            results/historical_option_reconstruction_summary.json
            results/historical_option_quality_by_date.csv
            results/historical_option_quality_summary.json
          retention-days: 90
