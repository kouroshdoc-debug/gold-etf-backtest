name: Lotus option forward snapshots

on:
  workflow_dispatch:
    inputs:
      target:
        description: Execution target
        required: true
        default: github-hosted-diagnostic
        type: choice
        options:
          - github-hosted-diagnostic
          - self-hosted-windows
  push:
    branches: [main]
    paths:
      - 'src/option_snapshot_capture.py'
      - 'tests/test_option_snapshot_capture.py'
      - '.github/workflows/option-snapshot.yml'
      - 'requirements.txt'
  schedule:
    # Local capture: Tehran market window, Sat-Wed. Requires an online Windows runner.
    - cron: '0,30 5-8 * * 6,0-3'
    - cron: '0 9 * * 6,0-3'

permissions:
  contents: write

concurrency:
  group: lotus-option-forward-snapshot
  cancel-in-progress: false

jobs:
  hosted-diagnostic:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'github-hosted-diagnostic')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe capture without fabricating rows
        run: >-
          python src/option_snapshot_capture.py
          --out data/option_snapshots_gated.csv
          --status-out results/option_snapshot_status.json
          --allow-source-unavailable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: option-snapshot-hosted-diagnostic
          path: results/option_snapshot_status.json
          if-no-files-found: error
          retention-days: 90

  capture-on-local-windows:
    if: github.event_name == 'schedule' || inputs.target == 'self-hosted-windows'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture executable Lotus option quotes
        run: >-
          python src/option_snapshot_capture.py
          --out data/option_snapshots_gated.csv
          --status-out results/option_snapshot_status.json
      - name: Validate latest executable rows
        run: |
          python -c "import json; s=json.load(open('results/option_snapshot_status.json',encoding='utf-8')); assert s['status']=='CAPTURED' and s['rows_appended']>0, s; print(s)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: option-snapshot-local-status
          path: results/option_snapshot_status.json
          if-no-files-found: warn
          retention-days: 90
      - name: Commit immutable forward snapshot data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/option_snapshots_gated.csv
          $staged = git diff --cached --name-only
          if (-not $staged) { Write-Host "No snapshot changes to commit."; exit 0 }
          git commit -m "data: append Lotus option forward snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
