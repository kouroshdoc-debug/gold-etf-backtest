name: Option forward snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * 6,0,1,2,3'
    - cron: '15 6 * * 6,0,1,2,3'
    - cron: '15 7 * * 6,0,1,2,3'

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: pip install requests
      - name: Capture executable option quotes
        run: python src/option_snapshot_capture.py --auto --out data/option_snapshots.csv
      - name: Validate snapshot output
        run: python -c "import csv; rows=list(csv.DictReader(open('data/option_snapshots.csv',encoding='utf-8'))); assert rows, 'empty snapshot'; print('rows=',len(rows),'valid_quotes=',sum(r.get('quote_valid')=='True' for r in rows))"
      - uses: actions/upload-artifact@v4
        with:
          name: option-snapshot-${{ github.run_id }}
          path: data/option_snapshots.csv
          retention-days: 90
